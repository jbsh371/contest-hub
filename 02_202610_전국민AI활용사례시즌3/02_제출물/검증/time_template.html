<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시간 비교 기록표</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --fg:#222; --muted:#666; --line:#ddd; --go:#2e7d32; --stop:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 "Malgun Gothic", system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; z-index:2; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:17px; margin:0; flex:1 1 260px; }
  #clock { font:600 22px Consolas, monospace; min-width:90px; }
  header button, footer button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  #start { background:var(--go); color:#fff; border-color:var(--go); }
  #pause { background:#757575; color:#fff; border-color:#757575; }
  #end { background:var(--stop); color:#fff; border-color:var(--stop); }
  button:disabled { opacity:.4; cursor:default; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .help { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:14px; }
  @media (max-width:760px) { .card { grid-template-columns:1fr; } }
  .card img { width:100%; border:1px solid var(--line); border-radius:4px; cursor:zoom-in; }
  .meta { font-size:13px; color:var(--muted); word-break:break-all; }
  label { display:block; font-weight:600; margin-top:8px; }
  textarea { width:100%; min-height:52px; font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px; }
  .locked .card { opacity:.45; pointer-events:none; }
  footer { max-width:1100px; margin:0 auto 60px; padding:0 16px; }
  #out { width:100%; min-height:140px; font:13px Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="clock">00:00</span>
  <button id="start">시작</button>
  <button id="pause" disabled>잠깐 멈춤</button>
  <button id="end" disabled>끝</button>
</header>
<main id="main" class="locked">
  <div class="help" id="help"></div>
  <div id="list"></div>
</main>
<footer>
  <button id="dl">결과 내려받기</button>
  <textarea id="out" readonly></textarea>
</footer>
<script>
const DATA = __DATA__;
const KEY = "dots-time-v2-" + DATA.mode;
let st = { runs: [], ended: false, rows: {} };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} out(); };
document.getElementById("title").textContent = `${DATA.title} (${DATA.items.length}장, ${DATA.folder})`;
const HELP = {
  hand: `<b>할 일</b>: 그림마다 <b>① 무슨 화면인지 한 줄 메모</b>와 <b>② 공개한다면 가려야 할 곳</b>(무엇을, 어디에)을 적습니다. 가릴 곳이 없으면 "없음".
    <br><b>시간</b>: <b>시작</b>을 누르면 그림이 열립니다. 전화·자리 비움처럼 일과 상관없이 멈출 때만 <b>잠깐 멈춤</b>. 18장을 다 하면 <b>끝</b>.
    <br><b>기억해 내려 하지 말고, 그림에 보이는 것만</b> 적습니다 (예: "Gmail 임시보관함, 다온에 보내는 메일 초안"). 업무 흐름에서 무슨 뜻이었는지는 쓰지 않아도 됩니다. 빨리 하려고 서두르지 마세요.`,
  check: `<b>할 일</b>: AI가 미리 적은 <b>① 한 줄 메모</b>와 <b>② 가릴 곳</b>을 그림과 비교해, 틀린 것은 고치고 빠진 것은 더합니다. 맞으면 그대로 둡니다.
    <br><b>시간</b>: <b>시작</b>을 누르면 그림이 열립니다. 일과 상관없이 멈출 때만 <b>잠깐 멈춤</b>. 18장을 다 보면 <b>끝</b>.
    <br>손 정리 때와 같은 기준으로 봅니다: 그림에 보이는 것이 맞게 적혔나, 공개한다면 무엇을 가려야 하나.`
};
document.getElementById("help").innerHTML = HELP[DATA.mode] + `<br><b>단서</b> (당시 색인의 이 시간대 한 줄, AI도 같은 것을 받음): ${DATA.clue}`;
const list = document.getElementById("list");
for (const it of DATA.items) {
  const r = st.rows[it.id] || (st.rows[it.id] = { memo: it.memo || "", mask: it.mask || "", ai_memo: it.memo || "", ai_mask: it.mask || "" });
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div><img alt="${it.id}" loading="lazy"></div>
    <div><div><b>${it.id}</b></div><div class="meta">${it.name}</div>
    <label>① 무슨 화면인지 (한 줄)</label><textarea data-k="memo"></textarea>
    <label>② 가려야 할 곳</label><textarea data-k="mask"></textarea></div>`;
  const img = card.querySelector("img");
  img.dataset.src = it.url;
  img.onclick = () => window.open(it.url, "_blank");
  card.querySelectorAll("textarea").forEach(ta => {
    ta.value = r[ta.dataset.k];
    ta.oninput = () => { r[ta.dataset.k] = ta.value; save(); };
  });
  list.appendChild(card);
}
const $ = id => document.getElementById(id);
const running = () => st.runs.length && st.runs[st.runs.length - 1].end == null;
const total = () => st.runs.reduce((s, r) => s + ((r.end ?? Date.now()) - r.start), 0);
const fmt = ms => { const s = Math.round(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
function ui() {
  const started = st.runs.length > 0;
  $("main").classList.toggle("locked", !started);
  if (started) document.querySelectorAll("img[data-src]").forEach(i => { if (!i.src) i.src = i.dataset.src; });
  $("start").disabled = st.ended || running();
  $("start").textContent = started ? "다시 시작" : "시작";
  $("pause").disabled = st.ended || !running();
  $("end").disabled = st.ended || !started;
  $("clock").textContent = fmt(total());
}
$("start").onclick = () => { st.runs.push({ start: Date.now(), end: null }); save(); ui(); };
$("pause").onclick = () => { st.runs[st.runs.length - 1].end = Date.now(); save(); ui(); };
$("end").onclick = () => { if (running()) st.runs[st.runs.length - 1].end = Date.now(); st.ended = true; save(); ui(); };
setInterval(ui, 1000);
function out() {
  const L = [`# 시간 비교 결과: ${DATA.title}`, "", `- 폴더: ${DATA.folder}, ${DATA.items.length}장`,
    `- 걸린 시간(멈춘 시간 뺌): ${fmt(total())} (${Math.round(total() / 1000)}초)`,
    `- 시작·멈춤 기록: ${st.runs.map(r => new Date(r.start).toLocaleTimeString("ko-KR") + "~" + (r.end ? new Date(r.end).toLocaleTimeString("ko-KR") : "진행 중")).join(", ")}`,
    `- 끝: ${st.ended ? "예" : "아니오"}`, ""];
  let changed = 0;
  for (const it of DATA.items) {
    const r = st.rows[it.id];
    const ch = DATA.mode === "check" && (r.memo !== r.ai_memo || r.mask !== r.ai_mask);
    if (ch) changed++;
    L.push(`## ${it.id} ${it.name}${ch ? " (고침)" : ""}`, `- 메모: ${r.memo}`, `- 가릴 곳: ${r.mask}`);
    if (ch) L.push(`- AI 원래 메모: ${r.ai_memo}`, `- AI 원래 가릴 곳: ${r.ai_mask}`);
    L.push("");
  }
  if (DATA.mode === "check") L.splice(6, 0, `- 고친 장 수: ${changed} / ${DATA.items.length}`);
  $("out").value = L.join("\n");
}
$("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("out").value], { type: "text/markdown" }));
  a.download = `시간비교_결과_${DATA.mode}.md`; a.click();
};
ui(); out();
</script>
</body>
</html>
