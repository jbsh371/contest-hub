const DOCS = ["# 사례글 초안 v4 (claude, 2026-10-23)\n\n> [v4_작성기준.md](v4_작성기준.md)대로 썼다. 근거는 [사실목록_v1.md](사실목록_v1.md). Opus 에이전트가 같은 기준으로 따로 쓴 초안과 비교한다.\n> 각 칸의 글은 ``` 안에 있는 그대로 붙여 넣는다 (일반 텍스트).\n\n---\n\n## 공모 분야\n업무 생산성\n\n## 사례 제목 (200자 이내)\n```text\n찍을 때 고르지 않고 정리는 AI에게: 실습 캡처 600여 장과 녹화 25개를 다시 찾을 수 있는 기록으로 만든 방법\n```\n\n## 활용한 AI 도구 (500자 이내)\n```text\nClaude Code (Anthropic): 내 컴퓨터의 폴더와 파일을 직접 읽는 AI 도구. 실습 화면 기록을 정리하는 데 썼습니다.\n\nAI가 한 일: 캡처를 시간순으로 읽고 화면마다 한 줄 메모 쓰기, 다음 실습 단계의 폴더를 미리 만들고 잘못 넣은 캡처 옮기기, 빠진 장면 짚기, 가려야 할 곳 먼저 찾기, 녹화 영상에서 장면 뽑기, 지우기 전에 찍어 둘 화면 알려 주기, 물으면 기록에서 찾아 답하기\n\n사람이 한 일: 실습 진행, 화면 캡처와 녹화, 캡처를 폴더에 넣기, 정리 결과 확인\n\nAI가 하지 않은 일: 책에 쓸 그림 고르기, 공개 전 최종 확인\n\n책 원고를 쓰고 검토하는 데에는 Claude Code와 Codex(OpenAI)를 함께 썼습니다.\n```\n\n## 한 줄 소개 (200자 이내)\n```text\nIT 책 6권을 쓴 개발자가 새 AI 서비스 실습에서 찍을 때 고르지 않고 캡처 600여 장과 녹화 25개를 남긴 뒤, 정리는 AI에게 맡기고 책에 쓸 그림만 직접 확인해 실습서를 낸 방법입니다.\n```\n\n## 활용 사례 내용\n```text\n① 상황\n\n\"이 화면은 필요 없겠지.\"\n\n화면을 캡처하다 보면 자주 하는 생각입니다. 그런데 나중에 글을 쓰려고 기록을 열어 보면 꼭 그 화면이 없습니다. 있어도 수백 장 속에서 찾지 못합니다.\n\n저는 개발자로 일하면서 IT 책을 6권 썼습니다. 실습서는 \"이것을 누르면 이 화면이 나온다\"를 보여 줘야 해서, 화면 기록이 곧 원고의 재료입니다. 예전 방식에는 문제가 있었습니다.\n- 골라서 찍었습니다. 개인정보가 비칠까 봐 필요한 영역만 찍었고, 필요 없겠지 하고 넘긴 장면은 남지 않았습니다.\n- 기록하느라 멈췄습니다. 단계마다 멈춰 메모하고 무엇을 찍을지 고르느라 실습이 끊겼습니다.\n- 녹화는 엄두를 내지 못했습니다. 긴 영상에서 필요한 장면을 다시 찾는 일이 더 힘들었습니다.\n\n이번에는 새로 나온 AI 에이전트 서비스에 가상 회사의 워크숍 준비를 맡기고, 어떻게 반응하는지 기록해 책으로 쓰기로 했습니다. 실습은 10월 7일부터 11일까지 했습니다. AI의 반응은 같은 요청을 해도 다시 똑같이 나오지 않고, 무언가를 지우는 단계처럼 한 번뿐인 장면도 많았습니다. 놓치면 다시 찍을 수 없었습니다.\n\n화면을 보며 단계별로 한 일을 문서로 남기는 일은 업무 매뉴얼, 인수인계, 새 도구 시험 보고에서 늘 있습니다. 실습서 쓰기도 그중 하나입니다. 그래서 이번에는 찍을 때 고르지 않기로 했습니다. 정리는 AI에게 맡기기로 했습니다.\n\n② 사용한 AI와 활용 방법\n\n사용한 도구는 Claude Code입니다. 내 컴퓨터의 폴더를 직접 읽는 AI 도구라, 수백 장의 캡처와 녹화 파일을 채팅 창에 한 장씩 올리지 않고 폴더째 맡길 수 있었습니다.\n\n1. 실습 시나리오를 AI와 논의해 먼저 정했습니다. 날마다 무엇을 맡기고 어떤 반응을 볼지 적은 단계 목록입니다.\n2. 실습하면서 창 전체를 찍었습니다. 화면이 계속 바뀌는 구간은 녹화했습니다.\n3. AI가 시나리오의 다음 단계 폴더를 미리 만들어 두면, 저는 찍은 캡처를 그 폴더에 넣기만 했습니다. 잘못 넣은 캡처는 AI가 찾아 맞는 폴더로 옮겼습니다.\n4. 단계가 끝나면 한 줄로 요청했습니다. 가장 많이 쓴 말은 \"캡처 넣었어. 확인해 줘.\"였고, 하루에 열 번 넘게 쓴 날도 있습니다. AI는 파일 시각 순서대로 그림을 읽고 화면마다 한 줄 메모를 남겼습니다. 빠진 장면을 짚고, 가려야 할 메일 주소나 프로필을 먼저 찾아 적었습니다.\n5. 녹화 영상은 AI가 장면을 뽑아 이미지로 만들었습니다. 장면이 많을 때는 여러 장을 한 장에 모아 훑어볼 수 있게 했고, 저는 그것을 보고 쓸 만한 후보를 골랐습니다.\n6. 원고를 쓰다 기억이 흐리면 다시 물었습니다. \"실습 기록에 없어? 내 기억엔 봤어. 하지만 기억이 믿을 만한지.\" 하고 물으면 AI가 메모와 그림에서 찾아 답하고, 저는 그 그림을 열어 확인했습니다.\n\nAI가 찍을 시점을 알려 준 일도 있습니다. 시나리오의 다음 단계를 알고 있어서, 무언가를 지우는 단계 앞에서 \"지운 뒤에는 다시 찍을 수 없으니 그 전에 대화 전체와 설정 화면을 남겨 두세요\"라고 알렸습니다. 저도 헷갈리면 \"지금 이 시점에 찍는 게 맞아?\" 하고 물으며 진행했습니다.\n\n③ 결과 변화\n\n예전 같으면 없었을 기록이 생겼습니다. 녹화 25개에서 AI가 뽑은 장면이 1,391장입니다. 녹화를 쓸 엄두를 못 내던 때라면 존재하지도 않았을 기록입니다.\n\n닷새 동안 직접 찍은 캡처 600여 장은 AI가 장면별 폴더와 한 줄 메모로 정리했습니다. 캡처와 녹화 장면을 합치면 1,900여 장이지만, 제가 다시 열어 본 것은 AI가 만든 모아보기 122장과 책에 실을 그림 85장입니다. 나머지는 AI가 읽고 메모해 두었다가, 필요할 때 물으면 찾아 줬습니다.\n\n이 기록을 근거로 실습서 한 권을 써서 출간했습니다. 본문에 그림 85장이 들어갔습니다. 책을 낸 뒤에도 블로그 글을 쓰거나 새 개념을 이해하려고 직접 실습할 때 이 방식을 계속 쓰고 있습니다.\n\n이번 공모전을 준비하며 같은 일을 작게 재 봤습니다. 캡처 18장을 손으로 정리(화면마다 한 줄 메모, 가릴 곳 적기)하니 24분이 걸렸고, 다른 18장을 AI에게 맡기니 AI는 1분이 안 걸렸고 제가 결과를 훑어보는 데 7분 가까이 걸렸습니다. 고칠 곳은 없었습니다. 계산해 보면 직접 찍은 600여 장을 손으로 하면 14시간쯤, AI와 하면 4시간쯤입니다. 한 번 해 본 작은 비교이고, AI가 쓴 메모 20장을 다시 열어 보니 모두 맞았습니다(자세한 검사 결과는 아래에 있습니다).\n\n④ 나만의 방식\n\n판단을 나중으로 미룹니다. 찍을 때는 고르지도 가리지도 않습니다. 어떤 장면이 필요한지, 어디를 가려야 하는지는 정리할 때 판단합니다. 찍는 순간의 판단이 사라지니 실습에 집중할 수 있었습니다.\n\n시나리오가 정리의 지도입니다. AI가 다음 단계를 알아야 폴더를 미리 만들고, 캡처를 단계별로 나누고, 찍을 시점을 알려 줄 수 있습니다. 처음부터 완성된 시나리오는 아니었습니다. 실습하면서 AI 서비스의 반응을 보고 방향을 바꾼 곳이 여러 번 있었고, 그때마다 AI와 시나리오를 함께 고친 뒤 이어 갔습니다.\n\n확인은 밖으로 나갈 것에 씁니다. 정리용 메모는 AI를 믿고 넘깁니다. 대신 AI와 함께 고른 후보를 보고, 책에 실을 그림은 출판 전에 모두 다시 훑어봤습니다.\n\n직접 겪은 한계도 있습니다(제 환경에서 겪은 일입니다).\n- Windows 기본 녹화(Win + G)는 브라우저에서 다른 화면으로 넘어가자 녹화되지 않았습니다. 다른 녹화 프로그램은 뽑은 화면의 글자가 흐려서 쓰기 어려웠습니다.\n- 캡처 프로그램과 녹화 프로그램을 함께 켜면 충돌이 나서 하나만 썼습니다.\n- 녹화할 창을 잘못 골라, 보려던 화면 대신 다른 창이 녹화된 적이 있습니다.\n- 캡처를 잘라내기로 옮기다 잃어버린 적이 있습니다. 사람이 넣는 단계에서 빠지면 AI도 찾지 못합니다.\n- 폴더 이름을 시나리오 번호로 지었더니(\"메일6\") 2주 뒤에는 저도 무슨 뜻인지 몰랐습니다. 한 줄 메모가 있는 그림은 바로 알아봤습니다.\n\n⑤ 재현 가능성\n\n따라 하는 방법은 네 단계입니다.\n1. 무엇을 할지 짧은 단계 목록을 먼저 씁니다. 한 쪽이면 충분하고, AI와 함께 써도 됩니다.\n2. 고르지 말고 창 전체를 찍고, 단계마다 폴더에 넣습니다. 캡처는 운영체제 기본 기능으로 충분합니다.\n3. 실제 업무 화면이라면 민감한 부분을 먼저 가리고 넘깁니다. 그다음 AI에게 \"시간순으로 화면마다 한 줄씩 정리하고, 가려야 할 개인정보를 찾아 줘\"라고 요청합니다. 그림에 없는 사정은 한두 줄 덧붙입니다.\n4. 처음 몇 번은 AI의 메모가 맞는지 한 장씩 열어 봅니다. 믿을 만하면 글에 쓸 그림만 골라 확인합니다. 밖으로 공개할 그림은 끝까지 한 장씩 봅니다.\n\n저는 폴더째 읽는 AI 도구로 했지만, 캡처 몇십 장이라면 이미지를 여러 장 올릴 수 있는 채팅형 AI에서도 같은 요청으로 시작해 볼 수 있습니다. 다만 제가 직접 해 본 것은 아닙니다. 다른 사람이 이 방법을 따라 해 본 적도 아직 없습니다.\n\n실습서가 아니어도, 화면에서 단계별로 한 일을 문서로 남겨야 하는 업무라면 적용할 수 있습니다.\n- 업무 매뉴얼과 인수인계: 새 시스템을 맡은 담당자가 일하면서 찍기만 하면, 단계와 화면이 담긴 매뉴얼 초안이 남습니다.\n- 새 업무 도구 시험 보고: 도입을 검토하는 사람이 며칠 써 보며 찍어 두면, 어떤 기능이 어떻게 움직였는지 근거가 있는 보고서를 쓸 수 있습니다.\n- 오류 재현 보고: 고객지원이나 개발 담당자가 다시 일으키기 어려운 오류를 어떤 순서로 무엇을 눌렀는지 그대로 남길 수 있습니다.\n\n안전하게 쓰기 위해 지킨 것\n- 실습에는 실습용 계정과 가상의 인물·회사, 가상 메일 주소를 썼습니다. 결제 정보를 입력하는 화면에서는 녹화를 멈췄습니다.\n- 가리기 전의 원본 캡처도 AI 도구로 넘어갔습니다. 실습용 자료라 위험이 작았지만, 실제 업무 화면이라면 먼저 가리고 넘겨야 합니다.\n- 공개하는 그림은 AI가 가릴 곳을 먼저 찾고, 출판 전에 제가 모두 다시 훑어봤습니다. 첨부한 그림도 같은 방식으로 가렸습니다.\n- AI가 정리한 결과를 믿어도 되는지 확인하려고, 이번에 60장을 골라 다시 열어 봤습니다. AI가 쓴 한 줄 메모 20장은 모두 맞았고, 영상에서 뽑은 장면 15장은 모두 글자가 읽혔고, 책에 실린 그림 10장은 가려야 할 것이 남아 있지 않았습니다. 폴더 이름만 붙은 그림 14장은 어느 단계였는지 제가 판단하지 못했고, 3장은 제가 녹화할 창을 잘못 고른 것이었습니다. 표본이 작아 \"틀린 것이 없다\"고 말하지는 않습니다.\n- 첨부 그림 속 화면은 각 서비스의 화면을 직접 캡처한 것입니다.\n\nAI를 어디까지 썼는지\n- 책의 구성과 문장은 AI(Claude Code)가 쓰고 고쳤고, 다른 AI(Codex)가 검토했습니다. 기획과 실습 시나리오도 AI와 논의하며 만들었습니다. 저는 책의 방향과 기준을 정하고, 직접 실습하고, 원고를 모두 읽으며 장마다 고칠 곳을 짚었습니다. 고치는 일은 직접 하지 않고 AI가 모아서 하게 해, 무엇을 바꿨는지 기록이 남게 했습니다.\n- 이 글도 AI와 함께 썼고, 내용이 사실과 맞는지는 제가 확인했습니다.\n```\n\n---\n\n## 첨부 (안)\n1. 첨부1_사례본문_그림포함.pdf: 본문 + 작업 흐름 그림\n2. 첨부2_작업흐름.png: 시나리오(사람+AI) → 찍기(사람) → 폴더 미리 만들기·정리·메모(AI) → 확인(사람) → 다시 묻기\n3. 첨부3_정리예시_가림.png: 원본 캡처(가림) → AI의 한 줄 메모 → 책에 실린 그림\n4. 첨부4_검증결과.pdf: 오류 검사 60장 결과표, 시간 비교 표, 한계\n5. 첨부5_녹화장면추출_가림.png: 녹화 영상 → 모아보기 → 고른 장면\n\n## 작성자 메모\n- \"닷새\"는 10-07~11을 센 것. 사실 목록에 [확인] 표시가 남아 있어 사용자 확인 필요\n- \"책을 낸 뒤에도 블로그 글을 쓰거나…\" 는 사실 목록 1절 그대로. 빈도는 모름\n- 환산(14시간, 4시간)은 18장 속도 × 636장 계산\n", "# 사례글 초안 (opus)\n\n## 공모 분야\n업무 생산성\n\n## 사례 제목\n```text\n찍을 때는 고르지 않는다: 실습 화면 1,900여 장을 AI와 장면별 기록으로 정리한 방법\n```\n\n## 활용한 AI 도구\n```text\n용도: 실습 화면 기록 정리\n- Claude Code: 캡처와 녹화를 시간순으로 읽고 장면마다 한 줄 메모를 단 목록 만들기, 다음 단계 폴더 미리 만들기, 잘못 넣은 캡처 옮기기, 빠진 장면 짚기, 그림 속 글자 옮겨 적기, 필요한 부분 자르기, 개인정보 가리기, 녹화에서 장면 뽑기\n- 사람이 한 일: 실습 방향 정하기, 실습하며 창 전체 찍기와 녹화, 폴더에 넣기, 정리 결과 훑어보기\n- AI가 하지 않은 일: 책에 쓸 그림 고르기, 공개 전 최종 확인\n- 책 원고 작성에는 Claude Code(구성·문장)와 Codex(검토)를 썼습니다.\n```\n\n## 한 줄 소개\n```text\n실습 중에는 고르지 않고 창 전체를 찍고 녹화만 했습니다. \"캡처 넣었어. 확인해 줘.\" 한 줄로 AI가 시간순 정리, 빠진 장면 확인, 개인정보 가리기를 맡아 직접 찍은 636장과 녹화 25개를 장면별 기록으로 바꿨고, 그 기록으로 실습서 한 권을 냈습니다.\n```\n\n## 활용 사례 내용\n```text\n① 상황\nSW 개발자로 일하며 틈틈이 AI 관련 책을 써 왔고, 지금까지 6권을 냈습니다. 이번에는 새 AI 에이전트 서비스에 업무 하나를 맡겨 보고, AI가 무엇을 스스로 처리하고 무엇을 사람에게 묻는지를 실제 화면으로 보여 주는 실습서를 썼습니다. 가상의 행사 기획 회사 직원이 되어 고객사 사내 워크숍 준비를 맡기는 실습을 10월 7일부터 11일까지 했습니다.\n\n이런 책은 기록이 전부입니다. 그런데 손으로 화면을 찍으며 실습하면 늘 같은 문제가 생깁니다.\n- 찍느라 실습을 자꾸 멈추게 되고, 그사이 화면이 넘어가 놓치는 장면이 생깁니다.\n- 다시 할 수 없는 장면이 있습니다. 예를 들어 무언가를 지우고 나면 지우기 전 화면은 다시 찍을 수 없습니다.\n- 녹화로 대신하려 해도, 녹화 프로그램에 따라 화면을 옮기면 녹화가 되지 않았습니다.\n- 첫날 AI에게 보낸 말 그대로입니다. \"이미지 캡쳐가 재현하기 어렵고 시간과 노력이 많이 걸려.\"\n\n화면으로 한 일을 단계별로 문서로 남기는 일은 매뉴얼·인수인계·도구 시험 보고에 늘 있습니다. 실습서 쓰기도 그중 하나입니다. 그래서 이번에는 찍을 때 고르지 않기로 했습니다.\n\n② 사용한 AI와 활용 방법\n정리에는 Claude Code를 썼습니다. 내 컴퓨터의 폴더를 직접 열어 그림을 읽고, 폴더를 만들고, 파일을 옮기고 자를 수 있는 AI 도구입니다. 수백 장을 한 장씩 올릴 필요 없이 폴더째 맡길 수 있어서 골랐습니다.\n\n진행 순서는 이렇습니다.\n- 시나리오: 가상 인물 8명, 메일 5통과 실습 중에 넣는 변경 메일 5통, 일정 6건, 담당자 한도(100만 원)를 넘는 110만 원 계약 결정까지 AI와 함께 만들었습니다. Codex에게도 검토를 받았습니다.\n- 찍기와 녹화: 실습 중에는 무엇이 중요한지 따지지 않고 창 전체를 찍고, 녹화도 함께 했습니다.\n- 폴더에 넣기: 10월 9일부터는 AI가 시나리오의 다음 단계 폴더를 미리 만들어 두고, 저는 찍은 그림을 그 폴더에 넣기만 했습니다. 잘못 넣은 그림은 AI가 맞는 폴더로 옮겼습니다.\n- 한 줄 요청: \"캡처 넣었어. 확인해 줘.\" 요청은 대부분 이 한 줄이었고, 하루에 10번 넘게 보낸 날도 있습니다.\n- AI의 정리: 그림을 시간순으로 읽고, 장면마다 한 줄 메모를 단 목록을 만들고, 빠진 장면을 짚고, 그림 속 글자를 옮겨 적고, 필요한 부분만 자르고, 가릴 곳을 찾았습니다.\n- 녹화에서 장면 뽑기: \"내가 화면을 녹화하면 너가 이미지로 캡처할 수 있어\"라는 생각에서 시작했습니다. AI가 녹화에서 장면을 뽑고, 여러 장면을 한 장에 모은 모아보기를 만들어 훑은 뒤 후보를 골랐습니다.\n- 다시 묻기: 원고를 쓰다 기억이 흐리면 기록에 물었습니다. \"실습 기록에 없어? 내 기억엔 봤어. 하지만 기억이 믿을만 한지. … 캡처 확인해도 돼\"\n\nAI는 찍을 시점도 알려 줬습니다. 지우는 단계 앞에서 \"삭제 뒤 다시 찍을 수 없음 → 삭제 전에 대화 전체, 작업 편집 창, 설정 화면 보관\"이라는 알림이 왔습니다. 다시 할 수 없는 장면을 미리 챙기게 해 주는 알림이었습니다.\n\n③ 결과 변화\n가장 큰 변화는 예전에는 할 수 없던 일이 됐다는 점입니다.\n- 녹화에서 뽑은 장면 1,391장은 손으로만 찍었다면 아예 없었을 기록입니다.\n- 직접 찍은 캡처 636장과 녹화 25개가 시나리오 단계별 폴더로 정리됐습니다.\n- 제가 다시 들여다본 것은 모아보기 122장과 책에 실은 그림 85장입니다.\n- 이 기록으로 본문 11개 장짜리 실습서 한 권을 냈습니다.\n- 책을 낸 뒤에도 블로그 글을 쓸 때, 새 개념을 공부할 때 같은 방식을 쓰고 있습니다. 아주 편합니다.\n\n시간도 비교해 봤습니다. 공모전을 준비하며 사후에 해 본 작은 비교입니다. 같은 종류의 캡처 18장을 손으로 정리하니 24분 05초가 걸렸습니다. AI는 다른 18장을 47초에 정리했고, 제가 그 결과를 훑어보는 데 6분 34초가 걸렸으며 고친 곳은 없었습니다. 서로 다른 18장이라 정확한 비교는 아닙니다. 이 속도로 직접 찍은 636장을 계산해 보면 손으로는 약 14시간, AI와 훑어보기로는 약 4시간입니다. AI가 단 메모 20장을 다시 보니 모두 맞았습니다(자세한 것은 아래).\n\n④ 나만의 방식\n- 판단은 정리할 때로 미룹니다. 실습 중에는 고르지 않고 다 남깁니다. 고르는 일은 나중에 AI가 만든 목록과 모아보기를 보며 합니다.\n- 시나리오가 지도입니다. 폴더 순서를 시나리오 단계에 맞췄고, AI는 시나리오를 보고 다음에 찍을 장면과 놓치면 안 되는 시점을 알려 줬습니다. 시나리오는 진행하며 바뀌었고 그때마다 AI와 함께 고쳤습니다. \"이 시점이 맞는지\" 물어 가며 찍은 일도 많았습니다.\n- 확인은 밖으로 나갈 것에 씁니다. 사람의 시간은 모든 그림이 아니라 책에 실려 공개되는 그림에 썼습니다.\n\n한계도 있었습니다.\n- 윈도우 기본 녹화(Win + G)는 브라우저에서 다른 화면으로 넘어가면 녹화되지 않았고, 다른 녹화 프로그램은 뽑은 장면의 글자가 흐렸습니다. 이 문제를 해결했다고 말할 수는 없습니다.\n- 캡처 프로그램과 녹화 프로그램을 함께 켜면 충돌했습니다.\n- 녹화할 창을 잘못 골라 엉뚱한 화면이 녹화된 적이 있습니다. 제 실수입니다.\n- 잘라내기로 옮기다 캡처를 잃었습니다. 사람이 넣는 단계에서 빠지면 AI도 찾을 수 없습니다.\n- 폴더 이름을 \"메일6반영\"처럼 시나리오 번호로 지었더니, 2주 뒤 저도 \"메일6이 뭐야?\"라고 물었습니다. 이름에는 번호보다 내용을 적는 편이 낫습니다.\n\n⑤ 재현 가능성\n네 단계면 시작할 수 있습니다.\n1. 할 일의 순서를 짧은 시나리오로 적고, AI와 함께 단계별 폴더를 만듭니다.\n2. 작업하는 동안에는 고르지 말고 창 전체를 찍고, 가능하면 녹화도 함께 합니다.\n3. 실제 업무 화면이면 민감한 부분을 먼저 가리고 넘깁니다. 찍은 것을 폴더에 넣고 \"넣었어. 확인해 줘.\" 한 줄로 요청합니다. AI가 시간순 정리, 한 줄 메모, 빠진 장면, 가릴 곳을 알려 줍니다.\n4. 사람은 밖으로 나갈 결과물만 확인하고, 나중에 기억이 흐리면 기록에 다시 묻습니다.\n\n저는 폴더를 직접 다루는 Claude Code를 썼지만, 채팅형 AI에 캡처 몇 장을 올려 시간순 정리와 메모를 부탁하는 것으로도 시작해 볼 수 있습니다. 다만 다른 사람이 이 방법을 그대로 재현해 본 적은 아직 없습니다. 처음에는 하루치 작업 하나로 작게 시험해 보고, 폴더 이름에는 번호 대신 무슨 장면인지를 적는 것부터 지키기를 권합니다.\n\n이 방법은 다음과 같은 곳에 적용할 수 있습니다.\n- 사내 매뉴얼·인수인계: 새 시스템 사용법을 남겨야 하는 담당자, 자리를 옮기며 업무를 넘기는 직원\n- 새 도구 시험 보고: 도입 전에 AI 서비스나 업무 프로그램을 시험해 보고 보고서를 써야 하는 팀\n- 오류 재현 보고: 프로그램 오류를 겪고 어떤 순서로 문제가 생겼는지 개발팀이나 고객센터에 알려야 하는 사람\n세 경우 모두 \"화면으로 한 일을 순서대로 남기는 일\"이라는 점이 같습니다.\n\n안전하게 쓰기 위해 지킨 것\n- 실습용 계정과 가상 인물·가상 회사를 썼고, 메일 주소는 모두 가상 도메인(.example)이었습니다.\n- 결제 정보를 넣는 화면에서는 녹화를 멈췄습니다. 결제는 위험 부담이 있어 실습에서 뺐습니다.\n- 가리기 전 원본 캡처가 AI 도구(외부 서버)로 넘어갔습니다. 실습용 계정과 가상 자료라 위험은 작았지만, 실제 업무 화면이라면 먼저 가리고 넘겨야 합니다.\n- 책에 실은 그림은 AI가 메일 주소와 메일 목록 같은 가릴 곳을 먼저 찾아 가렸고, 출판 전에 제가 모두 훑어봤습니다.\n- 표본 60장으로 오류를 검사했습니다. AI 한 줄 메모 20장은 모두 맞았고, 영상에서 뽑은 장면 15장은 모두 글자가 읽혔고, 책 그림 10장은 가림에 문제가 없었습니다. 폴더 이름만 있어 맞는지 판단할 수 없는 14장이 있었고, 사람의 녹화 실수가 3장 있었습니다.\n- 책에 실은 화면에는 어느 서비스의 화면인지 밝혔습니다.\n\nAI를 어디까지 썼는지\n책의 구성과 문장은 Claude Code가 쓰고 고쳤고, Codex가 검토했습니다. 기획과 시나리오도 AI와 논의해 만들었습니다. 저는 방향과 기준을 정하고, 실습을 하고, 원고를 모두 읽고 장마다 고칠 곳을 짚었습니다. 기록을 남기려고 직접 고치지 않고 AI가 모아 고치게 했습니다. 이 글도 AI와 함께 썼고, 사실 확인은 제가 했습니다.\n```\n\n## 작성자 메모\n- 글자 수(공백 포함, 코드 블록 안 텍스트 기준): 제목 50자 / 도구 306자 / 한 줄 소개 145자 / 본문 4,108자 (그중 ⑤ 726자)\n- 작성 기준과 달리 한 곳: 없음. 다만 ④는 \"1. 2. 3.\"이 아니라 \"-\" 목록으로 썼다(접수 칸 형식 규칙 때문). ⑤의 네 단계만 숫자로 적었다(순서가 뜻을 가지므로)\n- 작성 기준에 있으나 사실 목록에서 근거를 찾지 못해 보수적으로 쓴 문장: \"책에 실은 화면에는 어느 서비스의 화면인지 밝혔습니다\"(작성 기준의 \"화면 출처 표시\"를 따랐으나 사실 목록에 직접 근거가 없음, 사용자 확인 필요). \"시나리오는 진행하며 바뀌었고 그때마다 AI와 함께 고쳤습니다\"(사실 목록은 \"바뀌었다\"까지, \"AI와 고침\"은 작성 기준 근거)\n- 녹화 문제는 \"해결했다고 말할 수는 없습니다\"로 썼다(해결 기록이 없을 뿐, 해결 못 했다는 기록도 없음)\n- 삭제 전 알림은 \"알림이 왔다\"까지만 쓰고, 그 덕에 장면을 남겼다고는 쓰지 않았다\n- 환산(약 14시간 대 약 4시간)은 18장 속도를 직접 찍은 636장에 곱한 계산이다: 손 1,445초/18장×636 ≈ 14.2시간, AI 441초/18장×636 ≈ 4.3시간\n- \"사람이 다시 본 것은 모아보기 122장과 책 그림 85장\"은 작성 기준 문구를 따랐으나, 사용자가 캡처를 실습 중에 따로 본 일은 있을 수 있어 \"제가 다시 들여다본 것\"으로 적었다. 확인 필요\n- ⑤ 끝의 \"하루치 작업 하나로 작게 시험\" 문장은 사실이 아니라 권고다\n- ① \"첫날 AI에게 보낸 말\"은 05_실제요청문장의 10-07 원문을 그대로 옮겼다(맞춤법 \"캡쳐\" 포함)\n- 채팅형 AI는 써 본 적이 없으므로 \"시작해 볼 수 있습니다\"로만 썼다\n", "# Codex CLI 독립 검토: 초안 v4 A(claude)·B(opus) (2026-10-23)\n\n> 입력: 사실목록_v1, 공모요강, 경쟁현황, v4_작성기준, 실제 요청 문장, 두 초안(작성자 표시 지움). 과제는 [과제_codex.md](과제_codex.md). codex exec -s read-only. 아래는 Codex 출력 그대로.\n\n---\n\n### 1. 결론\n\n**B를 뼈대로 삼고, A의 구체적인 재현 요청문·초기 확인 절차·첨부 구성을 가져오는 것을 권합니다.**\nB는 실제 작업 순서와 시간 비교의 한계를 더 정확하게 설명합니다. A는 근거 없는 과거 경험과 작업 결과를 덧붙인 부분이 많습니다.\n다만 두 초안 모두 기록 수량, 사람의 확인 범위, 미확인 사실의 단정을 고쳐야 제출할 수 있습니다.\n\n### 2. 사실 점검\n\n근거는 `01_사실목록.md`와 `05_실제요청문장.md`입니다. `04_작성기준.md`에 적혀 있어도 사실 근거가 없으면 인정하지 않았습니다. 아래의 **‘근거 없음’은 거짓으로 확정했다는 뜻이 아니라, 제공된 자료로 확인할 수 없다는 뜻**입니다.\n\n#### 초안 A\n\n**사실 목록에 없는 말**\n\n| 초안의 원문 | 근거와 판단 |\n|---|---|\n| “이 화면은 필요 없겠지.” / “화면을 캡처하다 보면 자주 하는 생각입니다.” | 01 §4와 05 §5에는 캡처 분실·기억의 불확실성은 있지만, 이런 생각을 자주 했다는 기록은 없습니다. 실제 회고처럼 만든 도입입니다. |\n| “골라서 찍었습니다. 개인정보가 비칠까 봐 필요한 영역만 찍었고, 필요 없겠지 하고 넘긴 장면은 남지 않았습니다.” | 01 §4·5와 05 §3에는 창 전체 캡처, 이후 자르기·가리기 요청이 있습니다. **과거에 개인정보 때문에 영역을 골라 찍었다는 작업 방식과 동기**는 없습니다. |\n| “단계마다 멈춰 메모하고 무엇을 찍을지 고르느라 실습이 끊겼습니다.” | 05 §2는 캡처의 시간·노력 부담을 뒷받침합니다. 단계마다 메모했다거나 그 때문에 실습이 끊겼다는 구체적인 경험은 확인되지 않습니다. |\n| “녹화는 엄두를 내지 못했습니다. 긴 영상에서 필요한 장면을 다시 찾는 일이 더 힘들었습니다.” | 01 §4·5, 05 §2에는 녹화 제안과 실제 녹화 문제만 있습니다. 과거에 녹화를 꺼린 이유나 영상 탐색이 더 힘들었다는 비교 경험은 없습니다. |\n| “날마다 무엇을 맡기고 어떤 반응을 볼지 적은 단계 목록입니다.” / “화면이 계속 바뀌는 구간은 녹화했습니다.” / “단계가 끝나면 한 줄로 요청했습니다.” | 시나리오, 녹화, 반복 요청은 각각 확인됩니다(01 §3~5). 그러나 **날짜별 시나리오 구성, 녹화 구간 선택 기준, 요청 시점**까지는 확인되지 않습니다. 불필요하게 구체화한 설명입니다. |\n| “물으면 AI가 메모와 그림에서 찾아 답하고, 저는 그 그림을 열어 확인했습니다.” | 01 §5와 05 §4에는 사용자가 다시 물은 문장이 있습니다. 그때 AI가 무엇을 찾아 답했는지, 사람이 해당 그림을 열어 확인했는지는 없습니다. 요청을 성공 결과로 바꿨습니다. |\n| “실습하면서 AI 서비스의 반응을 보고 방향을 바꾼 곳이 여러 번 있었고, 그때마다 AI와 시나리오를 함께 고친 뒤 이어 갔습니다.” | 01 §6은 사용자의 방향 변경 제안, §7-1은 진행 중 시나리오 변경을 확인합니다. **변경 원인이 서비스 반응이었다는 설명, 여러 번이라는 빈도, 매번 AI와 고쳤다는 절차**는 확인되지 않습니다. |\n| “찍는 순간의 판단이 사라지니 실습에 집중할 수 있었습니다.” | 01 §1의 “아주 편하다”는 확인되지만, 실습 집중도가 높아졌다는 별도의 사용자 평가는 없습니다. |\n| “캡처 프로그램과 녹화 프로그램을 함께 켜면 충돌이 나서 하나만 썼습니다.” | 충돌은 확인됩니다(01 §4, 05 §2). 이후 하나만 쓰는 방식으로 정착했다는 결과는 확인되지 않습니다. |\n| “한 줄 메모가 있는 그림은 바로 알아봤습니다.” | 01 §7-1의 메모 20장 정확성 검사는 ‘즉시 알아봄’이나 검색 속도 검사가 아닙니다. |\n| “첨부한 그림도 같은 방식으로 가렸습니다.” / “첨부 그림 속 화면은 각 서비스의 화면을 직접 캡처한 것입니다.” | 01에는 이번 공모전 첨부물의 제작·가림·내용 확인 기록이 없습니다. A 자신도 첨부를 ‘안’으로 제시합니다. 아직 계획인 첨부를 완료한 사실로 쓰면 안 됩니다. |\n| “다만 제가 직접 해 본 것은 아닙니다.” | 채팅형 AI 사용 경험은 01 §5에서 **[확인]** 상태입니다. ‘사용했다’도 ‘사용한 적 없다’도 확정할 수 없습니다. |\n| “이 글도 AI와 함께 썼고, 내용이 사실과 맞는지는 제가 확인했습니다.” | 책 원고를 모두 읽었다는 사실은 01 §6에 있습니다. **이번 사례글의 사실 확인을 사용자가 마쳤다는 기록은 없습니다.** 제출 전 확인을 마친 뒤 쓸 문장입니다. |\n\n**사실보다 센 말**\n\n| 초안의 원문 | 근거와 판단 |\n|---|---|\n| “AI의 반응은 같은 요청을 해도 다시 똑같이 나오지 않고, 무언가를 지우는 단계처럼 한 번뿐인 장면도 많았습니다.” | 삭제 전 보관 필요는 01 §5, 05 §6에 있습니다. 같은 요청의 재현 여부를 시험한 기록과 ‘한 번뿐인 장면이 많았다’는 근거는 없습니다. 삭제 사례로 좁히는 편이 정확합니다. |\n| “AI가 시나리오의 다음 단계 폴더를 미리 만들어 두면, 저는 찍은 캡처를 그 폴더에 넣기만 했습니다.” | 01 §5에 따르면 초반에는 사람이 폴더를 만들었고 **10월 9일부터** AI가 미리 만들었습니다. 기간을 빼면 처음부터 전 과정을 AI가 준비한 것으로 읽힙니다. |\n| “캡처를 시간순으로 읽고 화면마다 한 줄 메모 쓰기” / “AI는 파일 시각 순서대로 그림을 읽고 화면마다 한 줄 메모를 남겼습니다.” / “닷새 동안 직접 찍은 캡처 600여 장은 AI가 장면별 폴더와 한 줄 메모로 정리했습니다.” | 01 §5의 색인은 이틀뿐입니다. 10월 9일은 폴더·시각 범위별, 10월 10일은 파일별이며, 10월 11일은 색인 없이 후보 폴더로 나눴습니다. 모든 화면에 개별 메모가 있다는 설명은 성립하지 않습니다. ‘프로필’을 찾아 적었다는 세부 내용도 05 §3의 ‘사진’ 가리기 요청과 구별해야 합니다. |\n| “제가 다시 열어 본 것은 AI가 만든 모아보기 122장과 책에 실을 그림 85장입니다.” / “나머지는 AI가 읽고 메모해 두었다가, 필요할 때 물으면 찾아 줬습니다.” | 01 §5는 **AI가 모아보기를 만들어 훑었다**고 기록합니다. 사람이 122장을 모두 확인했다거나, 확인 범위가 이 두 종류뿐이었다거나, 나머지 전부에 메모와 검색 응답이 있었다는 근거는 없습니다. |\n| “책에 쓸 그림만 직접 확인해 실습서를 낸 방법입니다.” / “정리용 메모는 AI를 믿고 넘깁니다.” | 01 §7-1에는 정리 결과 훑어보기와 메모 표본 검사도 있습니다. 사람의 확인을 책 그림으로만 한정하면 실제 확인 범위를 잘못 전달합니다. |\n| “녹화를 쓸 엄두를 못 내던 때라면 존재하지도 않았을 기록입니다.” | 1,391장 추출은 확인됩니다(01 §5). 과거 녹화 불가 상태와 ‘AI가 없으면 존재하지 않았을 기록’이라는 가정은 입증되지 않았습니다. |\n| “고칠 곳은 없었습니다.” | 01 §7-1은 **훑어본 뒤 고친 것 0건**입니다. 고칠 문제가 없었다는 판정과는 다릅니다. “훑어본 뒤 수정한 곳은 없었습니다”가 정확합니다. |\n| “가리기 전의 원본 캡처도 AI 도구로 넘어갔습니다. 실습용 자료라 위험이 작았지만, 실제 업무 화면이라면 먼저 가리고 넘겨야 합니다.” | 원본의 외부 AI 전달은 01 §7에서 [확인] 사항입니다. 가상 시나리오를 썼다고 원본 화면의 개인정보 위험까지 평가한 것은 아닙니다. 05 §3에는 메일 주소·다른 메일 목록·사진 가리기 요청도 있습니다. |\n| “폴더 이름만 붙은 그림 14장은 어느 단계였는지 제가 판단하지 못했고” | 01 §7-1에는 판단 불가 14장이 있지만, **14장 전부의 원인이 폴더 이름뿐이었다는 설명**은 없습니다. 01 §4의 ‘메일6’ 일화와 검사 결과를 연결해 단정했습니다. |\n| “새 시스템을 맡은 담당자가 일하면서 찍기만 하면, 단계와 화면이 담긴 매뉴얼 초안이 남습니다.” | 실제 적용 사례가 아니라 제안입니다. 그마저도 정리 요청·맥락 설명·확인 단계가 필요한데 ‘찍기만 하면’ 결과물이 생긴다고 보장합니다. 01 §8에는 다른 사람의 재현이 아직 없습니다. |\n| “어떤 순서로 무엇을 눌렀는지 그대로 남길 수 있습니다.” | 오류 재현 보고에 활용할 가능성은 있지만, 정지 화면만으로 모든 클릭 순서를 보존할 수 있는 것은 아닙니다. 01 §4의 누락·녹화 실패도 고려해야 합니다. |\n\n**사실과 어긋나거나, 그대로 두면 역할·수량을 잘못 전달하는 말**\n\n| 초안의 원문 | 근거와 판단 |\n|---|---|\n| “장면이 많을 때는 여러 장을 한 장에 모아 훑어볼 수 있게 했고, 저는 그것을 보고 쓸 만한 후보를 골랐습니다.” | 01 §5에서 모아보기를 훑고 후보를 고른 주체는 AI입니다. 사람이 추가로 후보를 골랐을 가능성은 있지만, 현재 문장은 확인된 AI 역할을 사람 역할로 바꿔 서술합니다. |\n| “AI가 하지 않은 일: 책에 쓸 그림 고르기, 공개 전 최종 확인” | 공개 전 사람 확인은 근거가 있습니다. 그러나 01 §5에는 AI의 후보 선정이 있습니다. ‘그림 고르기’를 AI가 하지 않았다고 넓게 단정하면 충돌합니다. **후보 선정과 최종 선정은 구별해야 하며, 최종 선정 담당자는 별도 확인이 필요합니다.** |\n| “캡처와 녹화 장면을 합치면 1,900여 장이지만” | 01 §4·5를 합치면 직접 캡처 약 636장 + 추출 장면 1,391장 = **약 2,027장**입니다. 1,946장은 `manual` 안의 2,068장 중 모아보기 122장을 뺀 수이고, 다른 폴더의 추출 장면 81장은 포함하지 않습니다. 전체 합계 설명으로는 맞지 않습니다. |\n\n직접 인용도 정리해야 합니다. A의 “지운 뒤에는 다시 찍을 수 없으니 그 전에 대화 전체와 설정 화면을 남겨 두세요”와 “지금 이 시점에 찍는 게 맞아?”는 취지는 근거와 맞지만, 01 §5·7-1 및 05 §6에 있는 원문 그대로는 아닙니다. 실제 발언처럼 따옴표를 붙이려면 원문으로 바꾸고, 재구성한 문장이라면 간접화법으로 써야 합니다.\n\n**작성 기준의 금지 표현**\n\n- 책 제목·판매 링크·원고 작성 기간·‘AI 에이전트 개발자’·금지된 서비스 이름·화질 해결 주장은 **없음**입니다.\n- “AI는 1분이 안 걸렸고” 뒤에 사람 확인 시간을 함께 적었으므로, **‘1분 미만만 제시’ 금지에는 해당하지 않습니다.**\n- “틀린 것이 없다”는 이를 주장하지 않는다는 문장 안에 있으므로 금지 취지에 어긋나지 않습니다.\n- “화면마다”, “나머지는 AI가 읽고 메모”, “그림만 직접 확인”은 금지된 ‘빠짐없이’와 비슷한 전수 처리·확인 범위 오해를 만듭니다.\n- 제출용 코드 블록 안에는 표·굵은 글씨가 없습니다. 바깥의 검토용 마크다운은 접수 본문 위반으로 보지 않습니다.\n\n#### 초안 B\n\n**사실 목록에 없는 말**\n\n| 초안의 원문 | 근거와 판단 |\n|---|---|\n| “찍느라 실습을 자꾸 멈추게 되고, 그사이 화면이 넘어가 놓치는 장면이 생깁니다.” | 05 §2의 시간·노력 부담은 근거가 있지만, 반복 중단과 그사이 화면을 놓쳤다는 구체적인 인과관계는 없습니다. 일반적인 문제 가능성으로 쓰거나 실제 기록에 있는 어려움으로 바꾸는 편이 정확합니다. |\n| “시나리오는 진행하며 바뀌었고 그때마다 AI와 함께 고쳤습니다.” | 변경 자체는 01 §7-1에 있습니다. **매번 AI와 고쳤다는 절차**는 없습니다. 작성자 메모에서도 인정한 문제입니다. |\n| “책에 실은 화면에는 어느 서비스의 화면인지 밝혔습니다.” | 01 §2·7에는 출처 표시를 완료했다는 기록이 없습니다. 작성 기준의 요구를 완료 사실로 바꿨습니다. 작성자 메모의 ‘보수적으로 썼다’는 설명과 달리 본문은 단정형입니다. |\n| “이 글도 AI와 함께 썼고, 사실 확인은 제가 했습니다.” | 이번 사례글을 사용자가 사실 확인했다는 기록은 없습니다. 책 원고 검토와 별개입니다(01 §6). |\n| 작성자 메모: “채팅형 AI는 써 본 적이 없으므로” | 01 §5는 사용 경험을 [확인]으로 남겼습니다. 본문은 가능성 제안이지만, 메모의 ‘써 본 적 없음’은 확인된 사실이 아닙니다. |\n\n**사실보다 센 말**\n\n| 초안의 원문 | 근거와 판단 |\n|---|---|\n| “실습 중에는 고르지 않고 창 전체를 찍고 녹화만 했습니다.” / “실습 중에는 고르지 않고 다 남깁니다.” | 01 §4·7-1에는 캡처 누락·녹화 실패·시점 문의가 있습니다. 촬영 단계의 원칙을 설명하는 취지는 좋지만, ‘만’, ‘다’는 사람의 판단과 기록 누락을 지웁니다. |\n| “한 줄로 AI가 시간순 정리, 빠진 장면 확인, 개인정보 가리기를 맡아” | 한 줄 확인 요청은 05 §1에 있지만, 가리기에는 05 §3의 별도 요청도 있었습니다. 시나리오와 기존 지시가 쌓인 상태에서 가능했던 작업을 한 문장만의 효과로 압축했습니다. |\n| “장면마다 한 줄 메모를 단 목록 만들기” / “그림을 시간순으로 읽고, 장면마다 한 줄 메모를 단 목록을 만들고” | 01 §5의 실제 색인 범위보다 넓습니다. A와 마찬가지로 이틀의 서로 다른 색인 방식과 색인 없는 날을 구별해야 합니다. |\n| “가장 큰 변화는 예전에는 할 수 없던 일이 됐다는 점입니다.” / “녹화에서 뽑은 장면 1,391장은 손으로만 찍었다면 아예 없었을 기록입니다.” | 추출 수량은 맞습니다. 그러나 예전에 불가능했다거나 수동 작업으로 해당 장면을 확보할 수 없었다는 사실은 없습니다(01 §4·5). ‘녹화에서 장면을 확보했다’는 관찰 결과로 쓰면 됩니다. |\n| “직접 찍은 캡처 636장과 녹화 25개가 시나리오 단계별 폴더로 정리됐습니다.” | 01 §5는 캡처 분류와 영상에서 뽑은 장면의 후보 폴더를 뒷받침합니다. **녹화 원본 25개까지 전부 시나리오 폴더로 정리했다는 기록**은 없습니다. 직접 캡처 수도 원자료는 ‘약 636장’입니다. |\n| “제가 다시 들여다본 것은 모아보기 122장과 책에 실은 그림 85장입니다.” | 01 §5의 모아보기 검토 주체는 AI입니다. 사람의 122장 검토와 배타적인 확인 범위는 근거가 없습니다. ‘다시 들여다본’으로 바꿔도 이 문제는 없어지지 않습니다. |\n| “사람의 시간은 모든 그림이 아니라 책에 실려 공개되는 그림에 썼습니다.” | 01 §7-1에는 정리 결과 훑어보기와 표본 검사가 있습니다. 공개 그림에 확인을 집중했다는 설명과 공개 그림에만 시간을 썼다는 설명은 다릅니다. |\n| “결제는 위험 부담이 있어 실습에서 뺐습니다.” | 01 §7은 결제 화면에서 녹화를 멈췄다는 사실과 결제를 빼고 싶었다는 의사를 구별합니다. **실제로 결제를 실습에서 제외했다는 완료 사실**은 확인되지 않습니다. |\n| “메일 주소는 모두 가상 도메인(.example)이었습니다.” | 01 §3의 ‘모두’는 **시나리오 안의 메일 주소**에 관한 것입니다. 전체 캡처 화면으로 범위를 넓히지 않도록 “시나리오의 메일 주소”라고 써야 합니다. 05 §3에는 네이버 메일 주소와 다른 목록을 가려 달라는 요청도 있습니다. |\n| “가리기 전 원본 캡처가 AI 도구(외부 서버)로 넘어갔습니다. 실습용 계정과 가상 자료라 위험은 작았지만” | 원본의 외부 전달은 01 §7의 [확인] 사항입니다. 실습용 계정·가상 자료 사용만으로 실제 개인정보 노출 위험이 작았다고 평가할 수는 없습니다. |\n| “폴더 이름만 있어 맞는지 판단할 수 없는 14장이 있었고” | 판단 불가 14장은 확인되지만, 전부의 원인을 폴더 이름으로 단정할 근거는 없습니다(01 §7-1). |\n\n“사람은 밖으로 나갈 결과물만 확인하고”는 과거 사실이 아니라 **재현 방법으로 제시한 권고**입니다. 따라서 허위 경험으로 분류하지는 않습니다. 다만 중간 메모의 오류가 최종 설명에 들어갈 수 있으므로, 책임 있는 활용 절차로는 부족합니다.\n\n**사실과 어긋나거나, 그대로 두면 역할·수량을 잘못 전달하는 말**\n\n| 초안의 원문 | 근거와 판단 |\n|---|---|\n| “AI가 하지 않은 일: 책에 쓸 그림 고르기, 공개 전 최종 확인” | A와 같은 문제입니다. B 본문에는 AI가 “후보를 골랐습니다”라고 정확히 쓰면서 도구 칸에서는 그림 고르기를 AI 역할에서 제외합니다. 후보 선정과 최종 확인을 구분해야 합니다(01 §5·7-1). |\n| “찍을 때는 고르지 않는다: 실습 화면 1,900여 장을 AI와 장면별 기록으로 정리한 방법” | 1,900여 장은 `manual` 폴더의 집계로는 설명할 수 있습니다. 그러나 본문 전체 규모인 약 636장 + 1,391장을 가리킨다면 약 2,027장입니다. **현재 제목에는 집계 범위가 없어 본문과 수량 기준이 달라집니다.** |\n\nB의 “내가 화면을 녹화하면 너가 이미지로 캡처할 수 있어”도 05 §2의 원문을 줄여 다듬은 문장입니다. 내용 왜곡은 작지만, 직접 인용이라면 원문으로 맞추는 편이 좋습니다. 반면 ①의 “이미지 캡쳐가 재현하기 어렵고 시간과 노력이 많이 걸려.”는 원문과 맞습니다.\n\n**작성 기준의 금지 표현**\n\n- 명시적으로 금지한 책 정보·직업명·서비스 이름·화질 해결 주장·시간 비교의 한쪽 수치만 제시하는 표현은 **없음**입니다.\n- “다 남깁니다”는 ‘빠짐없이’와 같은 완전성 오해를 낳으므로 수정해야 합니다.\n- 제출 본문의 표·굵은 글씨 위반은 **없음**입니다.\n\n#### 두 초안에 공통으로 적용할 추가 판정\n\n- **검사 수량의 관계가 불명확합니다.** 메모 20장 + 영상 장면 15장 + 책 그림 10장 + 판단 불가 14장 + 녹화 실수 3장은 합계 62입니다. 원자료에도 이 수치가 함께 있으므로 초안이 새로 만든 오류는 아닙니다. 다만 서로 겹치는 항목인지 설명 없이 60장의 분류처럼 나열하면 안 됩니다. 겹침을 임의로 추정해서 고쳐서도 안 됩니다.\n- **시간 환산 계산 자체는 맞습니다.** 636장을 기준으로 손 정리 약 14.2시간, AI 처리와 사람 훑어보기 합계 약 4.3시간입니다. 그러나 서로 다른 18장에 대한 한 번의 사후 비교이며, 전체 작업 실측치가 아닙니다. 실제 10시간 절감으로 바꾸면 안 됩니다. B가 이 한계를 더 명확하게 씁니다.\n- **‘닷새’ 자체를 오류로 볼 필요는 없습니다.** 10월 7~11일은 달력상 닷새입니다. 01 §4의 확인 사항은 시나리오상 ‘나흘’과의 관계이므로, 실습 날짜를 그대로 적으면 혼동을 피할 수 있습니다.\n- **후속 사용은 근거가 있습니다.** 블로그 글과 새 개념 이해에 같은 방식을 쓴다는 내용은 01 §1에 있습니다. 다만 A가 덧붙인 “직접 실습할 때”라는 사용 조건과 구체적인 빈도는 확인되지 않습니다.\n\n### 3. 평가 항목별 비교\n\n현재 초안 그대로를 비교한 추정입니다. 작성 기준 준수 자체를 별도 점수로 더하지 않고, 공식 평가 항목에 미치는 영향을 보았습니다.\n\n| 평가 항목 | 심사위원이 볼 것 | A가 나은 점 | B가 나은 점 | 예상 차이 |\n|---|---|---|---|---|\n| **제안분야 적합성 20점** | 어떤 업무 문제이며, 왜 AI가 필요한지, 실제 상황이 구체적인지 | 화면 기록이 원고 재료가 된다는 설명과 문제 제기가 이해하기 쉽습니다. 다만 과거 경험을 지어낸 듯한 부분이 이 장점을 깎습니다. | 가상 워크숍 실습의 목적·날짜가 명확하고, 원문 요청으로 기록 부담을 설명합니다. | **B 약 1점 우세** |\n| **AI 활용 적정성 25점** | 도구 선택 이유, 실제 절차, 사람과 AI의 역할, 결과 활용 | 번호를 붙인 절차, 그림에 없는 사정을 덧붙이는 방법, 처음에는 메모도 확인하는 절차가 구체적입니다. | 10월 9일부터의 폴더 준비, AI의 후보 선정, 글자 옮기기·자르기·가리기 등을 실제 기록에 더 가깝게 씁니다. 구성 작성과 검토 도구도 구별합니다. | **B 약 2점 우세** |\n| **창의성·실용성 30점** | 흔한 이미지 정리와 무엇이 다른지, 재현이 쉬운지, 효과가 입증됐는지 | 초보자가 쓸 요청문이 구체적이고, 첨부로 작업 과정을 보여 주려는 구성이 있습니다. | 시나리오와 촬영 시점 알림의 연결, 실제 시나리오 규모, 정확한 시간 수치와 비교 한계가 더 선명합니다. 확산 대상도 분명합니다. | **B 약 2점 우세** |\n| **윤리·책임성 25점** | 개인정보·출처 처리, 정확성 확인, AI 기여 공개, 한계의 정직한 설명 | 초기 메모 검사 권고와 표본의 한계를 밝히는 문장은 좋습니다. | 책의 AI 관여를 명확히 밝히고, 녹화 문제를 해결했다고 주장하지 않습니다. 근거 없는 개인 경험·완료 주장도 A보다 적습니다. 다만 미확인 외부 전송·출처 표시·결제 제외 주장은 수정해야 합니다. | **B 약 2점 우세** |\n\n두 초안의 차이는 소재나 문장 취향보다 **같은 사실을 얼마나 덜 부풀렸는가**에서 생깁니다.\n\n### 4. 접수 칸 비교\n\n코드 블록 안의 실제 제출 문장을 세었습니다. 공백을 포함하고, 줄바꿈은 한 글자로 계산했습니다.\n\n| 접수 칸 | A | B | 판단 |\n|---|---:|---:|---|\n| 제목: 200자 이내 | **65자** | **50자** | **A 우세.** 직접 캡처와 녹화를 구분해 규모가 이해됩니다. B는 짧지만 ‘1,900여 장’의 집계 범위가 불명확합니다. A의 ‘다시 찾을 수 있는’도 전수 검색 성공으로 읽히지 않도록 다듬으면 좋습니다. |\n| 활용한 AI 도구: 500자 이내 | **370자** | **306자** | **B 우세.** 용도를 먼저 쓰고, Claude Code의 구성·문장 작성과 Codex의 검토를 구별합니다. 단, 두 초안 모두 ‘장면마다 메모’와 ‘AI가 그림을 고르지 않음’을 고쳐야 합니다. |\n| 한 줄 소개: 200자 이내 | **109자** | **145자** | **B 우세.** 방식·규모·결과가 바로 보입니다. A는 저자의 출간 경력에 공간을 쓰고, ‘그림만 직접 확인’으로 역할을 잘못 좁힙니다. B에서도 ‘녹화만’, ‘한 줄로 모든 처리’, 녹화 원본의 전수 분류는 수정해야 합니다. |\n\n세 칸 모두 제한 이내입니다.\n\n본문은 A **4,487자**, B **4,108자**로, 04의 권장 범위인 4,000~4,500자 안에 있습니다. ⑤의 소제목을 제외한 본문은 A 758자, B 717자로 둘 다 권장 분량에 맞습니다. B 작성자 메모의 726자는 소제목을 포함한 수치와 일치합니다.\n\nA 도구 칸은 용도보다 도구 설명이 먼저 나오므로 04의 배치 요구에는 덜 맞습니다. 다만 공식 평가에서 큰 감점 사유로 볼 정도는 아닙니다.\n\n### 5. 합칠 때 가져올 것\n\nB를 바탕으로 다음 **다섯 가지 이내**에서 A의 장점을 가져오는 편이 좋습니다.\n\n| 가져올 부분 | B의 어느 곳에, 어떻게 넣을지 | 이유 |\n|---|---|---|\n| **직접 캡처와 녹화를 구별하는 제목** | A의 수량 구분을 살려, 예를 들면 “캡처 600여 장의 정리를 AI에게: 시나리오에 맞춰 실습 기록을 남긴 방법”처럼 수정합니다. | 서로 다른 집계를 합친 ‘1,900여 장’ 문제를 피하면서 방식과 규모를 보여 줍니다. |\n| **구체적인 정리 요청문** | ⑤의 “넣었어. 확인해 줘.” 앞에 A의 “시간순으로 화면마다 한 줄씩 정리하고, 가려야 할 개인정보를 찾아 줘”를 **재현용 요청 예시**로 넣습니다. | 기존 맥락이 없는 독자에게도 무엇을 요구할지 알려 줍니다. 실제 과거 발언으로 소개하지는 않습니다. |\n| **화면에 없는 사정 덧붙이기** | ⑤ 3단계에 “그림에 없는 사정은 한두 줄 덧붙입니다”를 넣습니다. | 01 §4에 실제 근거가 있고, 화면만 보고 AI가 상황을 추측하는 문제를 줄입니다. |\n| **처음에는 중간 메모도 확인하는 절차** | B의 “밖으로 나갈 결과물만 확인”을 A의 초기 확인 절차로 바꿉니다. 이후에도 공개 내용의 근거가 되는 메모는 원본과 대조하도록 씁니다. | 재현성과 책임성을 함께 높입니다. 다만 이것은 **앞으로 따라 할 사람을 위한 권고**이며, 과거에 그렇게 했다고 쓰면 안 됩니다. |\n| **첨부로 처리 과정을 보여 주는 구성** | A의 ‘가린 화면 → AI 메모 → 책 그림’과 ‘검증 결과·한계’ 구성을 첨부 계획으로 가져옵니다. | 기능 나열보다 실제 산출물의 관계를 보여 주는 편이 평가에 유리합니다. 01 §8상 대응표는 아직 없으므로, 연결을 확인한 자료만 사용해야 합니다. |\n\n**가져오면 안 되는 것**은 A의 과거 촬영 방식·녹화 기피 경험, 사람이 모아보기 122장을 전부 봤다는 주장, 재질문에 AI가 정확히 답하고 사람이 확인했다는 결과, “찍기만 하면 매뉴얼 초안이 남는다”는 보장, 첨부 가림 완료 주장입니다.\n\nB에서도 결제 제외·출처 표시 완료·매번 AI와 시나리오 수정·원본 외부 전송을 미확인 상태로 유지해서는 안 됩니다. 합친다는 이유로 두 초안의 불확실한 문장을 서로의 근거로 삼을 수는 없습니다.\n\n### 6. 둘 다 놓친 것\n\n1. **작성 기준 자체의 오류를 걸러내지 못했습니다.**  \n   04의 ‘사람이 다시 본 모아보기 122장’, ‘매번 AI와 시나리오 수정’, ‘화면 출처 표시’, ‘원본 외부 전달’은 01의 근거 수준과 맞지 않습니다. 수량도 특정 폴더의 1,946장과 전체 추출량을 혼용합니다. 04를 충실하게 따른 것과 사실에 충실한 것은 별개입니다.\n\n2. **정리가 실제로 어떤 형태였는지 보여 주는 설명이 부족합니다.**  \n   두 초안 모두 ‘장면마다 한 줄’로 단순화합니다. 실제로는 10월 9일의 폴더·시각 범위별 색인, 10월 10일의 파일별 색인, 10월 11일의 후보 폴더라는 차이가 있습니다. 열어 보지 않은 항목에 ‘?’를 붙였다는 사실도 빠졌습니다(01 §5). 이는 AI가 확인하지 않은 것을 구분했다는 구체적인 책임성 근거가 됩니다.\n\n3. **한 줄 요청이 통했던 사전 조건이 부족합니다.**  \n   이미 시나리오와 작업 맥락이 공유되어 있었고, 개인정보 가리기에는 별도 지시가 있었습니다. 처음 쓰는 사람에게도 “넣었어” 한 줄이면 충분한 것처럼 안내하면 재현성이 떨어집니다. 사전 맥락과 반복 작업 중 짧은 요청을 구별해야 합니다.\n\n4. **효과 검증의 범위가 좁다는 점을 더 분명히 해야 합니다.**  \n   시간 비교는 다른 18장끼리 했고, 사람 확인은 정밀 검사가 아닌 훑어보기였습니다. 손 정리에도 추가 검토가 필요하다는 메모가 있었습니다(01 §7-1). 영상 15장의 가독성 확인은 ‘올바른 장면을 추출했는지’나 ‘누락 없이 확보했는지’를 검증한 것이 아닙니다. 메모 20장 검사도 전체 색인의 정확도를 보장하지 않습니다.\n\n5. **60장 검사의 항목 중복과 판단 불가 처리 방식이 빠졌습니다.**  \n   단순히 숫자를 많이 넣는 것으로는 검증이 명확해지지 않습니다. 62로 더해지는 이유, 판단 불가를 정확성 계산에서 어떻게 다루는지가 확인되지 않았습니다. 현재 자료만으로 정확도나 오류율을 만들어서는 안 됩니다.\n\n6. **재현·확산은 가능성 제안이며, 지속 사용의 규모는 아직 약합니다.**  \n   03의 수상작들은 ‘매일 사용’, ‘전 직원 사용’, ‘하루 수십 명 활용’ 등 반복 사용과 적용 규모를 제시합니다. 이 사례도 출간 후 사용은 있지만 빈도·기간·추가 산출물 수는 없습니다. 다른 사람의 재현도 없습니다. 이를 문장만으로 메우지 말고 현재 근거의 한계로 남겨야 합니다.\n\n7. **경쟁작과의 차이는 역할 분담 문구보다 실제 작업에 있습니다.**  \n   03의 수상작 대부분이 이미 ‘최종 판단은 사람’을 씁니다. #1569도 Claude Code와 ‘AI가 하지 않은 일’을 제시합니다. 따라서 그 형식 자체는 큰 차별점이 아닙니다. 이 사례의 차별점은 **시나리오에 맞춘 기록 정리, 삭제 전 촬영 알림, 캡처와 녹화 추출의 결합**입니다. 다만 03에서 같은 소재를 못 찾았다는 결과는 19편 정독 범위의 관찰이지, 전체 출품작에 유사 사례가 없다는 증명은 아닙니다.\n\n8. **공개용 가림과 외부 AI에 넘기기 전 가림을 구별해야 합니다.**  \n   책에 실을 그림을 사람이 훑어봤다는 사실은 공개 전 확인의 근거입니다. 그것이 원본의 외부 전달 단계까지 안전했다는 근거는 아닙니다. 화면 출처 표시 역시 요구 사항과 완료 사실을 구별해야 합니다.\n\n### 7. 예상 점수\n\n아래는 **제공된 문서만으로 한 추정**이며, 실제 심사 점수가 아닙니다. A·B는 현재 초안 상태, 합친 글은 위의 수정과 근거 없는 주장 삭제를 반영한 상태를 가정했습니다. 아직 없는 재현 실험·첨부·사용 실적을 추가한 것으로 계산하지 않았습니다.\n\n| 평가 항목 | 배점 | 초안 A | 초안 B | 권하는 대로 합친 글 |\n|---|---:|---:|---:|---:|\n| 제안분야 적합성 | 20 | 17 | 18 | 19 |\n| AI 활용 적정성 | 25 | 19 | 21 | 23 |\n| 창의성·실용성 | 30 | 21 | 23 | 24 |\n| 윤리·책임성 | 25 | 15 | 17 | 21 |\n| **합계** | **100** | **72** | **79** | **87** |\n\n대략 ±5점 정도의 불확실성이 있습니다. 합친 글의 개선 폭은 새 성과를 만들어서가 아니라, **근거 없는 단정을 줄이고 실제 절차와 확인 범위를 명확히 하는 것**에서 나옵니다. 다만 허위로 판단되는 내용이 남으면 점수와 별개로 심사 제외 문제가 생길 수 있으므로, 미확인 완료 주장은 먼저 제거해야 합니다."];
DOCS.forEach((md,i)=>{const el=document.querySelector('#c'+i+' .md');
  if(window.marked){el.innerHTML=marked.parse(md);} else {const p=document.createElement('pre');p.textContent=md;el.appendChild(p);}});
document.querySelectorAll('.bar input').forEach(cb=>cb.onchange=()=>document.getElementById('c'+cb.dataset.i).classList.toggle('hide',!cb.checked));
</script></body></html>
